[project]
name = "commonplace-pipeline"
version = "0.1.0"
description = "Ingestion pipeline: transcribe, chunk, tag, summarize, embed, load"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper",
    "anthropic",
    "voyageai",
    "supabase",
    "python-dotenv",
]

[project.scripts]
commonplace = "commonplace_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
